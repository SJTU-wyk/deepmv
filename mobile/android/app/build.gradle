plugins {
    id 'com.android.application'
}

// 把这里改成你的站点；本地调试用 10.0.2.2（模拟器映射宿主机）
def SERVER_URL = project.hasProperty('serverUrl') ? project.property('serverUrl') : 'https://deepmv.example.com'

android {
    namespace 'app.deepmv.client'
    compileSdk 34

    defaultConfig {
        applicationId "app.deepmv.client"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "SERVER_URL", "\"" + SERVER_URL + "\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            // 密钥文件不要提交到仓库；用 -PkeystorePath=... 传
            if (project.hasProperty('keystorePath')) {
                storeFile file(project.property('keystorePath'))
                storePassword project.property('keystorePassword')
                keyAlias project.property('keyAlias')
                keyPassword project.property('keyPassword')
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('keystorePath')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
