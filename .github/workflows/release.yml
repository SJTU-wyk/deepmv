name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- 1. 校验：类型 + 构建 + 冒烟 ----------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile --config.strictDepBuilds=false
      - run: pnpm --filter @deepmv/server exec tsc --noEmit
      - run: pnpm --filter @deepmv/web build
      - name: 冒烟
        run: |
          cd server && npx tsx src/index.ts &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:7821/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:7821/api/sources > /dev/null
          pkill -f "tsx src/index.ts" || true

  # ---------- 2. Web 站点包（给服务器 / 静态托管用） ----------
  web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile --config.strictDepBuilds=false
      - run: pnpm --filter @deepmv/web build
      - name: 打包 web-dist
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          cd web && tar -czf ../deepmv-web-${TAG}.tar.gz dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: deepmv-web-*.tar.gz

  # ---------- 3. Windows 便携版（Node 单文件） ----------
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile --config.strictDepBuilds=false
      - run: pnpm --filter @deepmv/web build
      - name: 复制运行时
        run: |
          New-Item -ItemType Directory -Force -Path dist/deepmv/server | Out-Null
          Copy-Item -Recurse server/src dist/deepmv/server/src
          Copy-Item -Recurse server/rules dist/deepmv/server/rules
          Copy-Item -Recurse server/package.json dist/deepmv/server/package.json
          Copy-Item -Recurse web/dist dist/deepmv/web/dist
          Copy-Item start.cmd dist/deepmv/start.cmd
      - name: 打 zip
        run: |
          $tag = "${env:GITHUB_REF}" -replace "refs/tags/", ""
          Compress-Archive -Path dist/deepmv/* -DestinationPath "deepmv-windows-$tag.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: deepmv-windows-*.zip

  # ---------- 4. Linux 单文件可执行（Node SEA 思路，给最小镜像） ----------
  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile --config.strictDepBuilds=false
      - run: pnpm --filter @deepmv/web build
      - name: 打 tar.gz
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p pkg/deepmv
          cp -r server/src server/rules server/package.json pkg/deepmv/
          mkdir -p pkg/deepmv/web && cp -r web/dist pkg/deepmv/web/
          cp deploy/systemd/deepmv.service pkg/deepmv/
          cd pkg && tar -czf ../deepmv-linux-${TAG}.tar.gz deepmv
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: deepmv-linux-*.tar.gz

  # ---------- 5. Docker 镜像（推 GHCR，别人的服务器一行命令就装） ----------
  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR 要求仓库名全小写，而 GitHub 用户名可能含大写（如 SJTU-wyk）
      - name: 计算小写镜像名
        id: repo
        run: echo "lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.lc }}:latest
            ghcr.io/${{ steps.repo.outputs.lc }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 6. Android APK（签名需要 keystore secret） ----------
  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      # ubuntu-latest 自带 Android SDK。不引 android-actions/setup-android：
      # 实测它在 Node 24 runner 上抛 Node.js 运行时异常，任务直接失败。
      - name: 确认 Android SDK 与 build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" >/dev/null 2>&1 || true
          fi
      - name: 注入站点地址
        run: echo "sdk.dir=$ANDROID_HOME" > mobile/android/local.properties
      - name: 构建 APK
        working-directory: mobile/android
        run: |
          gradle assembleRelease --no-daemon \
            -PserverUrl="${{ vars.DEEPMV_SERVER_URL }}"
      # GitHub 不允许在 if 里用 secrets 上下文，所以先落到 env 再判断
      - name: 签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/deepmv.jks
          TAG=${GITHUB_REF#refs/tags/}
          APK=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks /tmp/deepmv.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --out deepmv-android-${TAG}.apk "$APK"
          rm -f /tmp/deepmv.jks
      # 没配 keystore 时也要产出：给出未签名包，使用者可自行签名
      - name: 整理未签名包
        if: always()
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          APK=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f "$APK" ]; then cp "$APK" "deepmv-android-${TAG}-unsigned.apk"; fi
          ls -la deepmv-android-*.apk 2>/dev/null || echo "无 apk 产出"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: deepmv-android-*.apk
          if-no-files-found: warn

  # ---------- 7. 汇总发布 ----------
  release:
    needs: [web, windows, linux, docker]
    # 任一平台构建失败也不阻塞发布：已有的产物照样发出去
    if: always() && needs.web.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
        continue-on-error: true
      - name: 列出产物
        run: find artifacts -type f | head -20
      - uses: softprops/action-gh-release@v2
        with:
          # 用 glob 而不是固定路径：某个平台没产出时不会整体失败
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false