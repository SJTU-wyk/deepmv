# 如果更熟 Nginx，用这份；证书用 certbot 拿
server {
    listen 80;
    server_name deepmv.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name deepmv.example.com;

    ssl_certificate     /etc/letsencrypt/live/deepmv.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepmv.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 限流兜底：和应用的令牌桶不是一回事，nginx 层先挡一道
    limit_req_zone $binary_remote_addr zone=deepmv:10m rate=30r/m;

    location /api/ {
        limit_req zone=deepmv burst=20 nodelay;
        proxy_pass http://127.0.0.1:7821;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:7821;
        proxy_set_header Host $host;
    }
}
